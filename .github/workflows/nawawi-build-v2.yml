          EOF

      - name: Generate launcher icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          t=Path('payload/index.html').read_text(encoding='utf-8')
          refs=re.findall(r'images/[^"\']+\.(?:png|webp|jpg|jpeg)',t,re.I)
          src=Path('payload')/(refs[0] if refs else 'images/img01.webp')
          im=Image.open(src).convert('RGBA');side=max(im.size);base=Image.new('RGBA',(side,side),(15,90,67,255));scale=min(side*.68/im.width,side*.68/im.height);q=im.resize((int(im.width*scale),int(im.height*scale)),Image.Resampling.LANCZOS);base.alpha_composite(q,((side-q.width)//2,(side-q.height)//2))
          for d,s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p=Path('android/app/src/main/res/mipmap-'+d);p.mkdir(parents=True,exist_ok=True);x=base.resize((s,s),Image.Resampling.LANCZOS);x.save(p/'ic_launcher.png');x.save(p/'ic_launcher_round.png')
          base.resize((432,432),Image.Resampling.LANCZOS).save('android/app/src/main/res/drawable/ic_launcher_foreground.png')
          PY
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Offline pre-build audit
        run: |
          ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          r=Path('android/app/src/main/assets');t=(r/'index.html').read_text(encoding='utf-8');m=re.search(r'const HADITHS\s*=\s*(\[.*?\])\s*;\s*const TOTAL_HADITHS',t,re.S);assert len(json.loads(m.group(1)))==42
          assert not re.search(r'https?://',t);assert len(list((r/'audio').glob('NAW*.mp3')))==42
          for ref in set(re.findall(r'(?:audio|images|fonts)/[^"\'\s)]+',t)):
              assert (r/ref).exists(),ref
          print('offline asset audit passed')
          PY

      - name: Build APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Inspect APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          ! grep -q "android.permission.INTERNET" apk-permissions.txt
          COUNT=$(unzip -l "$APK" | grep -E 'assets/audio/NAW[0-9]{3}\.mp3' | wc -l | tr -d ' ')
          echo "audio files in APK: $COUNT"
          test "$COUNT" = "42"
          cp "$APK" Nawawi-Test-001.apk
          sha256sum Nawawi-Test-001.apk | tee Nawawi-Test-001.apk.sha256
          printf 'Protected hadith records: 42\nLocal audio files: 42\nInternet permission: NONE\nPackage: com.adnani.nawawi42\nminSdk: 19\n' > BUILD-REPORT.txt
          ls -lh Nawawi-Test-001.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nawawi-Test-001
          path: |
            Nawawi-Test-001.apk
            Nawawi-Test-001.apk.sha256
            BUILD-REPORT.txt
            apk-badging.txt
            apk-permissions.txt
          if-no-files-found: error
          retention-days: 30
