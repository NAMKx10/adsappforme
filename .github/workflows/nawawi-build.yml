name: Build Nawawi Test 001

on:
  push:
    branches: [nawawi-apk-direct2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and media tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet numpy pillow

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download approved payload and source recording
        run: |
          curl -L --fail --retry 3 -o Nawawi-Build-001.tar.gz https://raw.githubusercontent.com/Mirsad140/Mirsad001/main/Nawawi-Build-001.tar.gz
          mkdir payload
          tar -xzf Nawawi-Build-001.tar.gz -C payload
          curl -L --fail --retry 3 -o full.mp3 https://d1.islamhouse.com/data/ar/ih_sounds/chain_01/Almtoon_Al3lmeeh/AlArb3un_AlNuweh/ar_AlArb3un_AlNuweh_Duraihim.mp3
          echo "payload_sha256=$(sha256sum Nawawi-Build-001.tar.gz | awk '{print $1}')"
          echo "source_size=$(stat -c%s full.mp3)"

      - name: Verify protected hadith data
        run: |
          python3 - <<'PY'
          import pathlib,re,json,hashlib
          p=pathlib.Path('payload/index.html')
          t=p.read_text(encoding='utf-8')
          m=re.search(r'(const HADITHS = (\[.*?\]);\s*const TOTAL_HADITHS)',t,re.S)
          assert m, 'Protected HADITHS block not found'
          data=json.loads(m.group(2))
          assert len(data)==42
          assert [h.get('number') for h in data]==list(range(1,43))
          expected=pathlib.Path('payload/HADITHS.sha256').read_text().strip().split()[0]
          candidates={
            hashlib.sha256(m.group(1).encode()).hexdigest(),
            hashlib.sha256(m.group(2).encode()).hexdigest(),
            hashlib.sha256(json.dumps(data,ensure_ascii=False,separators=(',',':')).encode()).hexdigest(),
          }
          print('protected_hash_file',expected)
          print('candidate_hashes',sorted(candidates))
          assert expected in candidates, 'Protected HADITHS hash mismatch'
          assert not re.search(r'https?://',t), 'Unexpected external URL in approved HTML'
          print('Protected 42-hadith data verified')
          PY

      - name: Verify source recording matches approved first four files
        run: |
          python3 - <<'PY'
          import csv,subprocess,numpy as np, pathlib
          rows=list(csv.DictReader(open('payload/segments.csv',encoding='utf-8-sig')))
          assert len(rows)==42
          def pcm(cmd):
              r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              return np.frombuffer(r.stdout,dtype='<f4')
          def env(x):
              frame=400
              n=(len(x)//frame)*frame
              x=x[:n].reshape(-1,frame)
              e=np.sqrt(np.mean(x*x,axis=1)+1e-12)
              e=np.log1p(e*20)
              e=(e-e.mean())/(e.std()+1e-9)
              return e
          def best_corr(a,b,max_shift=30):
              best=-1
              for s in range(-max_shift,max_shift+1):
                  aa=a[max(0,s):len(a)+min(0,s)]
                  bb=b[max(0,-s):len(b)+min(0,-s)]
                  n=min(len(aa),len(bb)); aa=aa[:n]; bb=bb[:n]
                  if n<20: continue
                  c=float(np.dot(aa,bb)/(np.linalg.norm(aa)*np.linalg.norm(bb)+1e-9))
                  best=max(best,c)
              return best
          for i,row in enumerate(rows[:4],1):
              start=float(row['start_seconds']); dur=float(row['duration_seconds'])
              original=f"payload/audio/{row['file']}"
              a=env(pcm(['ffmpeg','-v','error','-i',original,'-ac','1','-ar','8000','-f','f32le','-']))
              b=env(pcm(['ffmpeg','-v','error','-i','full.mp3','-ss',str(start),'-t',str(dur),'-ac','1','-ar','8000','-f','f32le','-']))
              c=best_corr(a,b)
              print(f'hadith_{i}_source_correlation={c:.4f}')
              assert c>0.72, f'Audio source mismatch at hadith {i}: {c}'
          print('Audio source verified against approved files 1-4')
          PY

      - name: Generate local audio files 5-42
        run: |
          python3 - <<'PY'
          import csv,subprocess,pathlib
          rows=list(csv.DictReader(open('payload/segments.csv',encoding='utf-8-sig')))
          out=pathlib.Path('payload/audio'); out.mkdir(exist_ok=True)
          for row in rows[4:]:
              start=float(row['start_seconds']); dur=float(row['duration_seconds'])
              dest=out/row['file']
              subprocess.run([
                  'ffmpeg','-y','-v','error','-i','full.mp3','-ss',f'{start:.3f}','-t',f'{dur:.3f}',
                  '-map','0:a:0','-vn','-ac','1','-ar','44100','-codec:a','libmp3lame','-b:a','64k',
                  '-map_metadata','-1',str(dest)
              ],check=True)
          files=sorted(out.glob('NAW*.mp3'))
          assert len(files)==42, len(files)
          print('Generated audio count:',len(files))
          PY

      - name: Validate all audio durations
        run: |
          python3 - <<'PY'
          import csv,subprocess,json,pathlib
          rows=list(csv.DictReader(open('payload/segments.csv',encoding='utf-8-sig')))
          for row in rows:
              f=pathlib.Path('payload/audio')/row['file']
              assert f.exists() and f.stat().st_size>1000, f
              r=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','json',str(f)],capture_output=True,text=True,check=True)
              actual=float(json.loads(r.stdout)['format']['duration'])
              expected=float(row['duration_seconds'])
              delta=abs(actual-expected)
              print(row['number'],row['file'],f'{actual:.3f}',f'delta={delta:.3f}')
              assert delta<0.75, (row['file'],actual,expected)
          PY

      - name: Add embedded offline reading fonts
        run: |
          mkdir -p payload/fonts
          curl -L --fail --retry 3 -o payload/fonts/naskh.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf'
          curl -L --fail --retry 3 -o payload/fonts/kufi.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf'
          curl -L --fail --retry 3 -o payload/fonts/sans.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf'
          curl -L --fail --retry 3 -o payload/fonts/nastaliq.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf'
          curl -L --fail --retry 3 -o payload/fonts/amiri-regular.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf'
          curl -L --fail --retry 3 -o payload/fonts/amiri-bold.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('payload/index.html'); t=p.read_text(encoding='utf-8')
          css='''\n<style id="android-offline-fonts">\n@font-face{font-family:"JawamiNaskh";src:url("fonts/naskh.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}\n@font-face{font-family:"JawamiKufi";src:url("fonts/kufi.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}\n@font-face{font-family:"JawamiSans";src:url("fonts/sans.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}\n@font-face{font-family:"JawamiNastaliq";src:url("fonts/nastaliq.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}\n@font-face{font-family:"JawamiAmiri";src:url("fonts/amiri-regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:"JawamiAmiri";src:url("fonts/amiri-bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}\n</style>\n'''
          assert '</head>' in t
          t=t.replace('</head>',css+'</head>',1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/adnani/nawawi42 android/app/src/main/res/layout android/app/src/main/res/values android/app/src/main/res/values-v23 android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable android/app/src/main/assets
          cp payload/index.html android/app/src/main/assets/index.html
          cp -r payload/audio android/app/src/main/assets/audio
          cp -r payload/images android/app/src/main/assets/images
          cp -r payload/fonts android/app/src/main/assets/fonts
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='NawawiTest001'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.adnani.nawawi42'
            compileSdk 35
            defaultConfig {
              applicationId 'com.adnani.nawawi42'
              minSdk 19
              targetSdk 35
              versionCode 1
              versionName '0.1.0-test001'
            }
            buildTypes {
              debug { debuggable true; minifyEnabled false }
              release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          EOF
          echo '# test build' > android/app/proguard-rules.pro
          cat > android/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#FFFDF8"/>
          EOF
          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><color name="launcher_bg">#0F5A43</color></resources>
          EOF
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:windowNoTitle">true</item><item name="android:colorAccent">#C99A3B</item><item name="android:navigationBarColor">#0F5A43</item><item name="android:statusBarColor">#0F5A43</item></style></resources>
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:usesCleartextTraffic="false" android:hardwareAccelerated="true" android:largeHeap="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="الأربعون النووية" android:supportsRtl="true" android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <provider android:name=".ShareFileProvider" android:authorities="com.adnani.nawawi42.share" android:exported="false" android:grantUriPermissions="true"/>
            </application>
          </manifest>
          EOF

      - name: Create Android native bridge
        run: |
          cat > android/app/src/main/java/com/adnani/nawawi42/MainActivity.java <<'EOF'
          package com.adnani.nawawi42;

          import android.app.Activity;
          import android.content.*;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.view.View;
          import android.webkit.*;
          import android.widget.Toast;
          import java.io.*;

          public class MainActivity extends Activity {
            private static final int OPEN_FILE=1001, SAVE_FILE=1002;
            private WebView webView;
            private ValueCallback<Uri[]> modernCallback;
            private ValueCallback<Uri> legacyCallback;
            private String pendingSaveText=null, pendingSaveMime="application/json";

            @Override public void onCreate(Bundle state){
              super.onCreate(state); setContentView(R.layout.activity_main); webView=findViewById(R.id.webView); configure();
              if(state==null) webView.loadUrl("file:///android_asset/index.html"); else webView.restoreState(state);
            }

            private void configure(){
              WebSettings s=webView.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setDefaultTextEncodingName("utf-8");
              if(Build.VERSION.SDK_INT>=16){ s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(false); }
              if(Build.VERSION.SDK_INT>=17) s.setMediaPlaybackRequiresUserGesture(false);
              s.setBuiltInZoomControls(false); s.setDisplayZoomControls(false);
              webView.addJavascriptInterface(new ShareBridge(),"AndroidShare");
              webView.addJavascriptInterface(new FileBridge(),"AndroidFiles");
              webView.addJavascriptInterface(new ClipboardBridge(),"AndroidClipboard");
              webView.setWebViewClient(new WebViewClient(){ @Override public void onPageFinished(WebView v,String url){ super.onPageFinished(v,url); injectBridge(); }});
              webView.setWebChromeClient(new WebChromeClient(){
                @Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> cb,FileChooserParams p){ modernCallback=cb; openFile(); return true; }
                public void openFileChooser(ValueCallback<Uri> cb){ legacyCallback=cb; openFile(); }
                public void openFileChooser(ValueCallback<Uri> cb,String type){ legacyCallback=cb; openFile(); }
                public void openFileChooser(ValueCallback<Uri> cb,String type,String capture){ legacyCallback=cb; openFile(); }
              });
            }

            private void injectBridge(){
              String js="(function(){if(window.__nawawiNative)return;window.__nawawiNative=1;"+
                "var sh=function(d){d=d||{};return new Promise(function(ok,no){try{var fs=d.files||[];if(fs.length){var f=fs[0],r=new FileReader();r.onload=function(){AndroidShare.shareDataUrl(d.title||'',d.text||'',f.name||'nawawi-card.png',r.result);ok();};r.onerror=no;r.readAsDataURL(f);}else{AndroidShare.shareText(d.title||'',d.text||'');ok();}}catch(e){no(e);}});};"+
                "try{Object.defineProperty(navigator,'share',{configurable:true,value:sh});}catch(e){navigator.share=sh;}"+
                "var cs=function(){return true};try{Object.defineProperty(navigator,'canShare',{configurable:true,value:cs});}catch(e){navigator.canShare=cs;}"+
                "try{Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:function(t){AndroidClipboard.copy(String(t||''));return Promise.resolve();}}});}catch(e){}"+
                "var oc=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){var a=this;if(a.download&&a.href){if(a.href.indexOf('blob:')===0){fetch(a.href).then(function(r){return r.text()}).then(function(t){AndroidFiles.saveText(a.download||'nawawi-backup.json',t,'application/json')});return;}if(a.href.indexOf('data:')===0){AndroidFiles.saveDataUrl(a.download||'nawawi-file',a.href);return;}}return oc.call(a);};"+
                "})();";
              webView.evaluateJavascript(js,null);
            }

            private void openFile(){ Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("application/json"); startActivityForResult(i,OPEN_FILE); }

            private void createSave(String name,String text,String mime){ pendingSaveText=text; pendingSaveMime=mime==null?"application/octet-stream":mime; Intent i=new Intent(Intent.ACTION_CREATE_DOCUMENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType(pendingSaveMime); i.putExtra(Intent.EXTRA_TITLE,name); startActivityForResult(i,SAVE_FILE); }

            @Override protected void onActivityResult(int req,int result,Intent data){ super.onActivityResult(req,result,data); Uri uri=(result==RESULT_OK&&data!=null)?data.getData():null;
              if(req==OPEN_FILE){ if(modernCallback!=null){modernCallback.onReceiveValue(uri==null?null:new Uri[]{uri});modernCallback=null;} if(legacyCallback!=null){legacyCallback.onReceiveValue(uri);legacyCallback=null;} }
              else if(req==SAVE_FILE){ if(uri!=null&&pendingSaveText!=null){ try(OutputStream os=getContentResolver().openOutputStream(uri)){ os.write(pendingSaveText.getBytes("UTF-8")); Toast.makeText(this,"تم حفظ النسخة",Toast.LENGTH_SHORT).show(); }catch(Exception e){Toast.makeText(this,"تعذر الحفظ",Toast.LENGTH_SHORT).show();} } pendingSaveText=null; }
            }

            @Override protected void onSaveInstanceState(Bundle out){ webView.saveState(out); super.onSaveInstanceState(out); }
            @Override public void onBackPressed(){ if(webView.canGoBack()){webView.goBack();return;} webView.evaluateJavascript("(function(){try{if(typeof currentPage!=='undefined'&&currentPage&&currentPage!=='home'&&typeof showPage==='function'){showPage('home');return '1'}return '0'}catch(e){return '0'}})()",v->{if(v==null||!v.contains("1")) MainActivity.super.onBackPressed();}); }

            public class ClipboardBridge { @JavascriptInterface public void copy(String text){ ((android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE)).setPrimaryClip(ClipData.newPlainText("حديث",text)); runOnUiThread(()->Toast.makeText(MainActivity.this,"تم النسخ",Toast.LENGTH_SHORT).show()); } }
            public class FileBridge {
              @JavascriptInterface public void saveText(String name,String text,String mime){ runOnUiThread(()->createSave(name,text,mime)); }
              @JavascriptInterface public void saveDataUrl(String name,String dataUrl){ try{int c=dataUrl.indexOf(',');String meta=dataUrl.substring(5,c);String body=dataUrl.substring(c+1);String text=java.net.URLDecoder.decode(body,"UTF-8");runOnUiThread(()->createSave(name,text,meta.split(";")[0]));}catch(Exception e){} }
            }
            public class ShareBridge {
              @JavascriptInterface public void shareText(String title,String text){ runOnUiThread(()->{Intent s=new Intent(Intent.ACTION_SEND);s.setType("text/plain");s.putExtra(Intent.EXTRA_SUBJECT,title);s.putExtra(Intent.EXTRA_TEXT,text);startActivity(Intent.createChooser(s,"مشاركة الحديث"));}); }
              @JavascriptInterface public void shareDataUrl(String title,String text,String filename,String dataUrl){ try{int c=dataUrl.indexOf(',');byte[] bytes=android.util.Base64.decode(dataUrl.substring(c+1),android.util.Base64.DEFAULT);File dir=new File(getCacheDir(),"share");dir.mkdirs();String safe=(filename==null?"nawawi-card.png":filename).replaceAll("[^A-Za-z0-9._-]","_");File f=new File(dir,safe);try(FileOutputStream o=new FileOutputStream(f)){o.write(bytes);}Uri uri=Uri.parse("content://com.adnani.nawawi42.share/"+Uri.encode(safe));runOnUiThread(()->{Intent s=new Intent(Intent.ACTION_SEND);s.setType("image/png");s.putExtra(Intent.EXTRA_SUBJECT,title);s.putExtra(Intent.EXTRA_TEXT,text);s.putExtra(Intent.EXTRA_STREAM,uri);s.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);startActivity(Intent.createChooser(s,"مشاركة بطاقة الحديث"));});}catch(Exception e){shareText(title,text);} }
            }
          }
          EOF
          cat > android/app/src/main/java/com/adnani/nawawi42/ShareFileProvider.java <<'EOF'
          package com.adnani.nawawi42;
          import android.content.*;import android.database.*;import android.database.MatrixCursor;import android.net.Uri;import android.os.ParcelFileDescriptor;import android.provider.OpenableColumns;import java.io.*;
          public class ShareFileProvider extends ContentProvider{
            public boolean onCreate(){return true;} private File f(Uri u)throws FileNotFoundException{String n=Uri.decode(u.getLastPathSegment());if(n==null)throw new FileNotFoundException();n=n.replace("/","_").replace("\\","_");File x=new File(new File(getContext().getCacheDir(),"share"),n);if(!x.exists())throw new FileNotFoundException();return x;}
            public String getType(Uri u){String n=u.getLastPathSegment();return n!=null&&n.toLowerCase().endsWith(".png")?"image/png":"application/octet-stream";} public ParcelFileDescriptor openFile(Uri u,String m)throws FileNotFoundException{return ParcelFileDescriptor.open(f(u),ParcelFileDescriptor.MODE_READ_ONLY);} public Cursor query(Uri u,String[] p,String s,String[] a,String so){try{File x=f(u);MatrixCursor c=new MatrixCursor(new String[]{OpenableColumns.DISPLAY_NAME,OpenableColumns.SIZE});c.addRow(new Object[]{x.getName(),x.length()});return c;}catch(Exception e){return null;}} public Uri insert(Uri u,ContentValues v){throw new UnsupportedOperationException();} public int delete(Uri u,String s,String[] a){return 0;} public int update(Uri u,ContentValues v,String s,String[] a){return 0;}
          }
          EOF

      - name: Generate Adaptive and Legacy icon from app entry logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          t=Path('payload/index.html').read_text(encoding='utf-8')
          m=re.search(r'<img[^>]+class="[^"]*(?:entry-logo|landing-logo)[^"]*"[^>]+src="(images/[^"]+)"',t)
          if not m: m=re.search(r'<img[^>]+src="(images/[^"]+)"[^>]+class="[^"]*(?:entry-logo|landing-logo)[^"]*"',t)
          src=Path('payload')/(m.group(1) if m else 'images/img01.webp')
          im=Image.open(src).convert('RGBA'); bbox=im.getchannel('A').getbbox(); im=im.crop(bbox) if bbox else im
          side=max(im.size); canvas=Image.new('RGBA',(side,side),(15,90,67,255)); scale=min(side*.72/im.width,side*.72/im.height); r=im.resize((max(1,int(im.width*scale)),max(1,int(im.height*scale))),Image.Resampling.LANCZOS); canvas.alpha_composite(r,((side-r.width)//2,(side-r.height)//2))
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d,s in sizes.items():
              p=Path('android/app/src/main/res')/('mipmap-'+d);p.mkdir(parents=True,exist_ok=True);q=canvas.resize((s,s),Image.Resampling.LANCZOS);q.save(p/'ic_launcher.png');q.save(p/'ic_launcher_round.png')
          fg=Path('android/app/src/main/res/drawable/ic_launcher_foreground.png');canvas.resize((432,432),Image.Resampling.LANCZOS).save(fg)
          PY
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Final pre-build offline audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('android/app/src/main/assets'); t=(root/'index.html').read_text(encoding='utf-8')
          m=re.search(r'const HADITHS = (\[.*?\]);\s*const TOTAL_HADITHS',t,re.S); assert len(json.loads(m.group(1)))==42
          assert not re.search(r'https?://',t)
          assert len(list((root/'audio').glob('NAW*.mp3')))==42
          for ref in set(re.findall(r'(?:src|href)=["\']((?:audio|images|fonts)/[^"\']+)',t)):
              assert (root/ref).exists(), ref
          print('Offline assets verified')
          PY
          ! grep -R "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Inspect built APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          if grep -q "android.permission.INTERNET" apk-permissions.txt; then echo 'INTERNET permission found'; exit 1; fi
          unzip -l "$APK" | grep -E 'assets/audio/NAW[0-9]{3}\.mp3' | wc -l | tee audio-count.txt
          test "$(cat audio-count.txt | tr -d ' ')" = "42"
          cp "$APK" Nawawi-Test-001.apk
          sha256sum Nawawi-Test-001.apk | tee Nawawi-Test-001.apk.sha256
          ls -lh Nawawi-Test-001.apk
          printf 'Protected hadiths: 42\nAudio files: 42\nInternet permission: NONE\nPackage: com.adnani.nawawi42\nminSdk: 19\n' > BUILD-REPORT.txt

      - name: Upload Nawawi Test 001
        uses: actions/upload-artifact@v4
        with:
          name: Nawawi-Test-001
          path: |
            Nawawi-Test-001.apk
            Nawawi-Test-001.apk.sha256
            BUILD-REPORT.txt
            apk-badging.txt
            apk-permissions.txt
          if-no-files-found: error
          retention-days: 30
