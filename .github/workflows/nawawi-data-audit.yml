name: Audit Nawawi religious vs technical fields

on:
  push:
    branches: [nawawi-apk-direct2]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect HADITHS field structure
        run: |
          curl -L --fail --retry 3 -o payload.tar.gz https://raw.githubusercontent.com/Mirsad140/Mirsad001/main/Nawawi-Build-001.tar.gz
          mkdir payload && tar -xzf payload.tar.gz -C payload
          python3 - <<'PY'
          from pathlib import Path
          import re,json,collections,hashlib
          t=Path('payload/index.html').read_text(encoding='utf-8')
          m=re.search(r'const HADITHS\s*=\s*(\[.*?\])\s*;\s*const TOTAL_HADITHS',t,re.S); assert m
          d=json.loads(m.group(1)); assert len(d)==42
          print('TOP_LEVEL_KEYS')
          allkeys=collections.Counter(k for h in d for k in h.keys())
          for k,c in allkeys.items(): print(k,c)
          print('TECHNICAL_LOOKING_VALUES')
          def walk(x,path=''):
              if isinstance(x,dict):
                  for k,v in x.items(): walk(v,path+'.'+k if path else k)
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
              elif isinstance(x,str):
                  low=x.lower()
                  if any(z in low for z in ['.mp3','audio/','data:audio','base64,','images/','data:image']):
                      print(path,repr(x[:160]),'LEN',len(x))
          for i,h in enumerate(d,1): walk(h,f'H{i}')
          print('FIELD_HASHES')
          for k in allkeys:
              vals=[h.get(k) for h in d]
              s=json.dumps(vals,ensure_ascii=False,separators=(',',':'))
              print(k,hashlib.sha256(s.encode()).hexdigest(),len(s))
          PY
