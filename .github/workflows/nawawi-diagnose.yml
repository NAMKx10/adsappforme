name: Nawawi Diagnose

on:
  push:
    branches: [nawawi-apk-direct2]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download approved build bundle
        run: |
          curl -L --fail --retry 3 -o /tmp/Nawawi-Build-001.tar.gz \
            https://raw.githubusercontent.com/Mirsad140/Mirsad001/main/Nawawi-Build-001.tar.gz
          mkdir -p /tmp/nawawi
          tar -xzf /tmp/Nawawi-Build-001.tar.gz -C /tmp/nawawi
      - name: Inspect bundle
        run: |
          echo '=== AUDIO SHA256 / DURATION / BITRATE / TAGS ==='
          for f in /tmp/nawawi/audio/*; do
            [ -f "$f" ] || continue
            echo "--- $(basename "$f") ---"
            sha256sum "$f"
            ffprobe -v error -show_entries format=duration,bit_rate:format_tags -of default=noprint_wrappers=1 "$f" || true
          done
          echo '=== MP3 HEADERS ==='
          for f in /tmp/nawawi/audio/*; do
            [ -f "$f" ] || continue
            echo "--- $(basename "$f") ---"
            file "$f" || true
            strings -n 8 "$f" | head -n 20 || true
          done
          echo '=== INDEX AUDIO PATHS ==='
          grep -o 'audio/[A-Za-z0-9_.-]*' /tmp/nawawi/index.html | sort -u || true
