name: Nawawi Diagnose

on:
  push:
    branches: [nawawi-apk-direct2]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet numpy scipy
      - name: Download approved bundle and full source audio
        run: |
          curl -L --fail --retry 3 -o /tmp/Nawawi-Build-001.tar.gz https://raw.githubusercontent.com/Mirsad140/Mirsad001/main/Nawawi-Build-001.tar.gz
          mkdir -p /tmp/nawawi
          tar -xzf /tmp/Nawawi-Build-001.tar.gz -C /tmp/nawawi
          curl -L --fail --retry 3 -o /tmp/full.mp3 https://d1.islamhouse.com/data/ar/ih_sounds/chain_01/Almtoon_Al3lmeeh/AlArb3un_AlNuweh/ar_AlArb3un_AlNuweh_Duraihim.mp3
      - name: Derive expected timings and match approved tracks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,subprocess,numpy as np
          from scipy.signal import correlate, correlation_lags

          t=Path('/tmp/nawawi/index.html').read_text(encoding='utf-8')
          m=re.search(r'const HADITHS = (\[.*?\]);\s*const TOTAL_HADITHS',t,re.S)
          assert m
          hs=json.loads(m.group(1))
          print('=== EXPECTED TIMING ENDPOINTS ===')
          for h in hs:
              st=max((x[1] for x in h.get('syncTimes',[]) if isinstance(x,list) and len(x)>1), default=0)
              se=max((x.get('end',0) for x in h.get('sentenceUnits',[])),default=0)
              print(f"{h['number']:02d}\t{h.get('audio','')}\tsyncEnd={st:.3f}\tsentenceEnd={se:.3f}")

          def envelope(path, rate=8000, win=400):
              raw=subprocess.check_output(['ffmpeg','-v','error','-i',str(path),'-ac','1','-ar',str(rate),'-f','f32le','-'])
              x=np.frombuffer(raw,dtype='<f4')
              n=len(x)//win
              x=x[:n*win].reshape(n,win)
              e=np.sqrt(np.mean(x*x,axis=1)+1e-10)
              e=np.log(e+1e-4)
              e=np.diff(e,prepend=e[0])
              return e
          full=envelope('/tmp/full.mp3')
          step=.05
          print('=== CORRELATION OFFSETS ===')
          for i in range(1,5):
              p=f'/tmp/nawawi/audio/NAW{i:03d}.mp3'
              e=envelope(p)
              a=max(1,int(len(e)*.15)); b=max(a+20,int(len(e)*.85))
              q=e[a:b]
              q=(q-q.mean())/(q.std()+1e-8)
              f=(full-full.mean())/(full.std()+1e-8)
              c=correlate(f,q,mode='valid',method='fft')
              j=int(np.argmax(c))
              score=float(c[j]/len(q))
              start=j*step-a*step
              print(f'NAW{i:03d}\tstart={start:.3f}\tend~={start+len(e)*step:.3f}\tscore={score:.4f}')
          PY
          echo '=== LONG SILENCES >= 2.0 sec ==='
          ffmpeg -hide_banner -i /tmp/full.mp3 -af silencedetect=noise=-38dB:d=2.0 -f null - 2>&1 | grep 'silence_' || true
