name: Nawawi Inspect Payload

on:
  push:
    branches: [nawawi-apk-direct2]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download uploaded payload
        run: |
          curl -L --fail --retry 3 -o Nawawi-Build-001.tar.gz https://raw.githubusercontent.com/Mirsad140/Mirsad001/main/Nawawi-Build-001.tar.gz
          sha256sum Nawawi-Build-001.tar.gz
          ls -lh Nawawi-Build-001.tar.gz
      - name: Inspect archive and timing table
        run: |
          mkdir payload
          tar -xzf Nawawi-Build-001.tar.gz -C payload
          echo '--- SEGMENTS CSV ---'
          cat payload/segments.csv
          echo '--- AUDIO COUNT ---'
          find payload/audio -type f 2>/dev/null | wc -l
          echo '--- HTML CHECK ---'
          python3 - <<'PY'
          import pathlib,re,json,hashlib
          p=pathlib.Path('payload/index.html'); t=p.read_text(encoding='utf-8')
          m=re.search(r'const HADITHS = (\[.*?\]);\s*const TOTAL_HADITHS',t,re.S)
          d=json.loads(m.group(1)); print('hadith_count',len(d)); print('numbers_ok',[h.get('number') for h in d]==list(range(1,43)))
          print('sha256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Download full Hamad Al-Duraihim recording
        run: |
          curl -L --fail --retry 3 -o full.mp3 https://d1.islamhouse.com/data/ar/ih_sounds/chain_01/Almtoon_Al3lmeeh/AlArb3un_AlNuweh/ar_AlArb3un_AlNuweh_Duraihim.mp3
          ls -lh full.mp3
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 full.mp3
      - name: Compare first four with slices from full recording
        run: |
          python3 - <<'PY'
          import csv,subprocess,pathlib,hashlib,os
          rows=[]
          with open('payload/segments.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          print('columns',rows[0].keys() if rows else [])
          for i,row in enumerate(rows[:4],1): print('row',i,row)
          PY
